<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>エッジ時刻デモ</title><style>
body{font-family:system-ui,sans-serif;background:#eef3f6;color:#172d3a;margin:0;padding:2rem}
main{max-width:1000px;margin:auto}.clock{background:white;border-radius:12px;padding:2rem;box-shadow:0 4px 20px #1232}
strong{font-variant-numeric:tabular-nums;font-size:clamp(1.3rem,4vw,2.2rem);overflow-wrap:anywhere}
button{padding:.65rem 1rem;background:#145780;color:white;border:0;border-radius:6px;cursor:pointer}
.device-tabs{display:flex;gap:.35rem;overflow-x:auto;border-bottom:2px solid #145780}
.device-tabs button{flex:none;white-space:nowrap;border-radius:6px 6px 0 0;background:#d7e4ec;color:#172d3a}
.device-tabs button[aria-selected="true"]{background:#145780;color:white}
.device-tabs button[data-state="warning"]{border-bottom:4px solid #df9a18}
.device-tabs button[data-state="critical"]{border-bottom:4px solid #d74444}
.device-tabs button[data-state="unknown"]{border-bottom:4px solid #77818a}
.device-tabs button:focus-visible{outline:3px solid #e79c28;outline-offset:-3px}
.device-panel{padding-top:1rem}
.iseg-panel{min-width:0;max-width:100%}
.iseg-group-tabs{display:flex;gap:.35rem;overflow-x:auto;margin-block:1rem;border-bottom:2px solid #145780;padding:.2rem .15rem 0}
.iseg-group-tabs button{flex:none;white-space:nowrap;background:#d7e4ec;color:#172d3a;border-radius:.4rem .4rem 0 0}
.iseg-group-tabs button[aria-selected="true"]{background:#145780;color:white}
.iseg-group-tabs button:focus-visible{outline:3px solid #e79c28;outline-offset:-3px}
.iseg-unassigned{margin-block:1rem;border:1px solid #bfced6;border-radius:.4rem}
.iseg-unassigned summary{padding:.55rem .7rem;cursor:pointer;font-weight:600}
.iseg-panel form{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.iseg-panel input:not([type=checkbox]){box-sizing:border-box;max-width:100%}
.iseg-table-scroll{max-width:100%;overflow-x:auto}
.iseg-data{border-collapse:collapse;width:100%;text-align:left}
.iseg-data th,.iseg-data td{padding:.4rem .45rem;border-bottom:1px solid #c3d0d8}
.iseg-data th{white-space:nowrap;font-size:.84rem}
.iseg-data .iseg-number{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.iseg-measured{font-weight:700}
.iseg-panel .iseg-setpoint{flex-wrap:nowrap;gap:.3rem}
.iseg-setpoint input{width:5.7em}
.iseg-data button{padding:.38rem .6rem}
.iseg-panel .iseg-bulk,.iseg-panel .iseg-editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.6rem;margin-bottom:1rem}
.iseg-panel .iseg-bulk fieldset{border:1px solid #bfced6;border-radius:.35rem;min-width:0;margin:0;padding:.4rem .6rem}
.iseg-bulk input[type=number]{width:5em}
.iseg-bulk button,.iseg-editor h3{grid-column:1/-1;justify-self:start}
.iseg-detail td,.iseg-detail button{white-space:nowrap}
.iseg-detail input[maxlength]{width:8rem}
.iseg-detail select{max-width:12rem}
.iseg-address{display:block;color:#4d6573}
.iseg-row-feedback{display:block;white-space:normal;max-width:11rem}
@media (max-width:600px){body{padding:1rem}.iseg-panel fieldset{min-width:0;max-width:100%;box-sizing:border-box}
.iseg-data th,.iseg-data td{padding:.35rem}}

.rph-panel{--surface:#161f2d;--raised:#202e3f;--line:#3d4d65;--text:#eef4fa;--accent:#82caff;--warning:#ffbf78;
  color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:clamp(.65rem,2vw,1.35rem)}
.rph-panel[data-theme=light]{--surface:#f2f8f3;--raised:#e2efe5;--line:#aabfaf;--text:#182f22;--accent:#15613e;--warning:#87440c}
.rph-header,.rph-panel form{display:flex;align-items:center;gap:.55rem}
.rph-header{justify-content:space-between;flex-wrap:wrap}
.rph-header h2{margin:.25rem 0}
.rph-panel button,.rph-panel input{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:.4rem;padding:.45rem .6rem}
.rph-panel button{color:var(--accent);white-space:nowrap}
.rph-panel button:disabled{opacity:.55;cursor:default}
.rph-panel :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rph-panel input{width:clamp(6rem,18vw,12rem)}
.rph-connection{margin:.8rem 0;padding:.5rem .7rem;border:1px solid var(--line);border-left:3px solid var(--warning);border-radius:.35rem}
.rph-mode{display:flex;align-items:center;gap:.55rem;margin-block:.8rem}
.rph-mode .rph-active{font-weight:700}
.rph-mode button[role=switch]{display:flex;align-items:center;width:2.75rem;height:1.5rem;padding:.15rem;border-radius:1rem}
.rph-mode button[aria-checked=true]{justify-content:flex-end;border-color:var(--accent)}
.rph-mode button span{width:1.1rem;height:1.1rem;border-radius:50%;background:currentColor}
.rph-scroll{overflow:auto;border:1px solid var(--line);border-radius:.55rem}
.rph-panel table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
.rph-panel thead{background:var(--raised)}
.rph-panel th,.rph-panel td{padding:.55rem .7rem;border-bottom:1px solid var(--line)}
.rph-panel tr:last-child td,.rph-panel tbody tr:last-child th{border-bottom:0}
.rph-panel .rph-number{text-align:right;font-variant-numeric:tabular-nums}
.rph-panel .rph-measured{font-weight:700}

.hv-panel{color-scheme:dark;--surface:#161e2b;--raised:#232e3e;--line:#3b4a5e;--text:#eff4fa;
  --muted:#aab9ca;--accent:#8ed0ff;--primary:#14639e;--warning:#ffbe7d;--grid:#ffffff09;
  --unknown:#8795a6;--fault:#ff7777;--ramping:#ffad58;--on:#56d39c;--off:#72a9ee;
  min-width:0;color:var(--text);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:3rem 3rem;border:1px solid var(--line);border-radius:.8rem;padding:clamp(.6rem,2vw,1.2rem)}
.hv-panel[data-theme=light]{color-scheme:light;--surface:#f3f8f4;--raised:#e2eee5;--line:#b3c9b9;--text:#193125;
  --muted:#486455;--accent:#176042;--primary:#226746;--warning:#8b4818;--grid:#235d3910;
  --unknown:#667681;--fault:#ac3131;--ramping:#a15418;--on:#207953;--off:#335f99}
.hv-toolbar,.hv-actions,.hv-label-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.hv-toolbar{justify-content:space-between}.hv-toolbar :is(h2,h3){margin:.25rem 0}
.hv-panel button{background:var(--primary);color:white;border:1px solid transparent;border-radius:.4rem;white-space:nowrap}
.hv-panel button:disabled{opacity:.55;cursor:default}
.hv-panel input,.hv-panel select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:.35rem;padding:.35rem .45rem}
.hv-panel input[type=checkbox]{accent-color:var(--primary)}
.hv-panel :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hv-panel :is(.hv-actions button,.iseg-group-tabs button){background:var(--raised);color:var(--text);border-color:var(--line)}
.hv-panel .iseg-group-tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.hv-panel :is(.iseg-group-tabs,.iseg-unassigned,.iseg-bulk fieldset){border-color:var(--line)}
.hv-panel .iseg-bulk{background:var(--raised);padding:.7rem;border-radius:.5rem}
.hv-panel .iseg-address{color:var(--muted)}
.hv-panel dialog{box-sizing:border-box;max-width:calc(100% - 2rem);max-height:85vh;overflow:auto;
  color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:.65rem}
.hv-panel dialog::backdrop{background:#0b121bbb}
.hv-settings{width:32rem}
.hv-panel .hv-settings-form{display:grid;gap:.65rem;margin-top:.6rem}
.hv-settings-form label{display:grid;gap:.25rem}
.hv-settings-form button{justify-self:start}
.hv-label-row{padding:.55rem 0;border-bottom:1px solid var(--line)}
.hv-status{padding:.55rem .7rem;border:1px solid var(--warning);border-radius:.4rem;color:var(--warning);
  background:color-mix(in srgb,var(--warning) 12%,var(--surface))}
.hv-status[data-online=true]{color:var(--on);border-color:var(--line);background:var(--raised)}
.hv-panel :is(.iseg-table-scroll,.rph-scroll){border:1px solid var(--line);border-radius:.5rem;background:var(--surface)}
.hv-panel :is(th,td){border-color:var(--line)}
.hv-panel thead,.hv-panel .iseg-unassigned summary{background:var(--raised)}
.hv-panel [data-state=unknown]{--state:var(--unknown)}
.hv-panel [data-state=fault]{--state:var(--fault)}
.hv-panel [data-state=ramping]{--state:var(--ramping)}
.hv-panel [data-state=on]{--state:var(--on)}
.hv-panel [data-state=off]{--state:var(--off)}
.hv-panel tr[data-state]{background:color-mix(in srgb,var(--state) 10%,var(--surface))}
.hv-panel tr[data-state]>:first-child{box-shadow:inset 3px 0 var(--state)}
.hv-legend{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .4rem;color:var(--text)}
.hv-legend::before{content:'';width:.6rem;height:.6rem;border-radius:50%;background:var(--state)}
</style><script type="importmap">{"imports":{"vue":"/static/vue.esm-browser.prod.js"}}</script>
</head><body><main><h1>エッジ時刻デモ</h1><p><a href="/setup">ノード設定</a></p><div id="app"></div></main>
